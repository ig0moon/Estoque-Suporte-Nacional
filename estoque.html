<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./img/nacional.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=brightness_5,dark_mode,desktop_windows,headset_mic,home,inventory_2"/>
  <link rel="stylesheet" href="css/style.css">
  <title>Estoque - Nacional</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
  <!-- Mantemos as modais invisíveis de auth pro caso do script.js procurar por elas -->
  <div id="auth-screen" class="overlay hidden"></div>

  <div id="app-content">
    <header>
      <div style="display:flex; align-items:center; gap:15px;">
        <!-- Botão de Voltar ao Hub -->
        <a href="index.html" class="btn sm icon-btn" title="Voltar ao Hub" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
        <h1>Estoque - Nacional</h1>
      </div>

      <div class="date">
          <span id="header-date"></span>
      </div>
      
      <button class="btn sm icon-btn" onclick="toggleDarkMode()" title="Alternar Modo Escuro">
        <span id="theme-icon" class="material-symbols-outlined">dark_mode</span>
      </button>

      <button class="btn sm" onclick="fazerLogout()" style="margin-left: 10px;">Sair</button>
    </header>

    <div class="container">
      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="toolbar-left">
          <input type="text" class="search" id="search" placeholder="🔍 Buscar..." oninput="render()">

          <select id="filter-status" onchange="render()" class="search" style="width:170px">
            <option value="">Todos Status</option>
            <option value="ok">OK</option>
            <option value="low">Estoque Baixo</option>
            <option value="out">Sem Estoque</option>
          </select>

          <select id="filter-cat" onchange="render()" class="search" style="width:170px">
            <option value="">Todas Categorias</option>
          </select>
        </div>
        <div class="toolbar-right" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="importXLSX()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Importar
          </button>
          <button class="btn" onclick="exportXLSX()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar .xlsx
          </button>
          <button class="btn primary" onclick="openModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Adicionar
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Qtd</th>
              <th>Mínimo</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty hidden" id="empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2M8 7V5a2 2 0 0 0-4 0v2"/></svg>
          Nenhum item encontrado
        </div>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog">
      <h2 id="modal-title">Novo item</h2>
      <div class="field">
        <label for="f-nome">Nome *</label>
        <input id="f-nome" type="text" placeholder="Ex: Cabo HDMI 2m">
      </div>
      <div class="field">
        <label for="f-cat">Categoria</label>
        <input id="f-cat" type="text" placeholder="Ex: Periféricos">
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-qty">Quantidade</label>
          <input id="f-qty" type="number" min="0" placeholder="0">
        </div>
        <div class="field">
          <label for="f-min">Estoque mínimo</label>
          <input id="f-min" type="number" min="0" placeholder="5">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" id="btn-save" onclick="saveItem()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="file-input" style="display:none" accept=".xlsx,.xls" onchange="handleFile(this)">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/darkmode.js" type="text/javascript"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js" type="text/javascript"></script>
  <script src="js/header-date.js" type="text/javascript"></script>
  <script src="js/estoque.js" type="text/javascript"></script>
</body>
</html>
