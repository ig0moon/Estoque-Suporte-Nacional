<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./img/nacional.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Celulares - Nacional</title>
  </head>

  <body>
    <div id="auth-screen" class="overlay hidden"></div>

    <div id="app-content" style="display: block">
      <header>
        <div class="header-inner">
          <div class="header-logo">
            <a href="index.html" class="btn sm icon-btn" title="Voltar ao Hub">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
            </a>
            <h1>Celulares Corporativos</h1>
          </div>

          <div class="header-user-info">
            <div id="header-nome" class="user-name">Carregando...</div>
            <div id="header-cargo" class="user-role">Carregando...</div>
          </div>

          <div class="header-controls">
            <div class="date">
              <span id="header-date"></span>
            </div>

            <button
              class="darkmode"
              onclick="toggleDarkMode()"
              title="Alternar Modo Escuro"
            >
              <span id="theme-icon" class="material-symbols-outlined"
                >dark_mode</span
              >
            </button>

            <button class="btn sm" onclick="fazerLogout()">Sair</button>
          </div>
        </div>
      </header>

      <div class="container">
        <div class="toolbar">
          <div
            class="toolbar-left"
            style="position: relative; display: flex; align-items: center"
          >
            <span
              class="material-symbols-outlined"
              style="
                position: absolute;
                left: 10px;
                color: var(--text-muted);
                font-size: 18px;
                pointer-events: none;
              "
              >search</span
            >
            <input
              type="text"
              class="search"
              id="search-celulares"
              placeholder="Buscar..."
              oninput="carregarCelulares()
              "
              style="padding-left: 35px;"
            />
          </div>
          <div class="toolbar-right">
            <button
              id="btn-add-celular"
              class="btn primary"
              onclick="abrirModalCelular()"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Adicionar
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Número</th>
                <th>Modelo</th>
                <th>Chip 1</th>
                <th>Chip 2</th>
                <th>Supervisor</th>
                <th>Carteira</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tbody-celulares"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div
      class="overlay hidden"
      id="overlay-celular"
      onclick="if (event.target === this) fecharModalCelular();"
    >
      <div class="modal">
        <h2 id="modal-title">Adicionar Celular</h2>
        <input type="hidden" id="c-id" />

        <div class="field">
          <label>Número *</label>
          <input
            id="c-numero"
            type="text"
            placeholder="Ex: 001 ou Patrimônio"
          />
        </div>

        <div class="field">
          <label>Modelo *</label>
          <input
            id="c-modelo"
            type="text"
            placeholder="Ex: Samsung Galaxy A54"
          />
        </div>

        <div class="field" style="display: flex; gap: 10px">
          <div style="flex: 1">
            <label>Chip 1</label>
            <input id="c-chip1" type="text" placeholder="Ex: (11) 99999-9999" />
          </div>
          <div style="flex: 1">
            <label>Chip 2</label>
            <input id="c-chip2" type="text" placeholder="Ex: (11) 88888-8888" />
          </div>
        </div>

        <div class="field">
          <label>Supervisor</label>
          <input
            id="c-supervisor"
            type="text"
            placeholder="Nome do supervisor"
          />
        </div>

        <div class="field">
          <label>Carteira</label>
          <input id="c-carteira" type="text" placeholder="Ex: Vendas" />
        </div>

        <div class="modal-footer">
          <button class="btn" onclick="fecharModalCelular()">Cancelar</button>
          <button
            class="btn primary"
            id="btn-save-celular"
            onclick="salvarCelular()"
          >
            Adicionar
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js" type="text/javascript"></script>
    <script src="js/darkmode.js" type="text/javascript"></script>
    <script src="js/db.js" type="text/javascript"></script>
    <script src="js/header-date.js" type="text/javascript"></script>
    <!-- Substitua pelo caminho correto do seu arquivo js -->
    <script src="js/celulares.js" type="text/javascript"></script>
  </body>
</html>
